# =============================================================================
# CVIEW DEPLOYMENT - VM1: FRONTEND (React SPA + Nginx Reverse Proxy)
# Private IP: 172.16.0.4 | Azure Virtual Network (VNet)
# =============================================================================

services:
  frontend:
    container_name: cview-frontend-vm1
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Mở cổng 80 cho người dùng Internet truy cập vào ứng dụng web
      - "80:80"
    volumes:
      # Mount cấu hình Nginx Reverse Proxy để có thể điều chỉnh linh hoạt không cần rebuild image
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      # Biến môi trường chỉ định Private IP của VM2 (Backend) trong mạng nội bộ Azure VNet
      BACKEND_API_URL: "http://172.16.1.4:8000/api/v1"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cview-frontend-net

networks:
  cview-frontend-net:
    driver: bridge
