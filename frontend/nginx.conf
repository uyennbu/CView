server {
    listen 80;
    server_name _;

    # Giới hạn kích thước file upload tối đa (phục vụ upload CV PDF <= 10MB)
    client_max_body_size 15M;

    # Cấu hình phục vụ file tĩnh của React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy: Chuyển tiếp các request /api/ sang Private IP của VM2 (Backend: 172.16.1.4)
    location /api/ {
        proxy_pass http://172.16.1.4:8000/api/;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout cho các tác vụ xử lý PDF nặng
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Endpoint kiểm tra sức khỏe của Nginx
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Tùy biến trang lỗi
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
